<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Images 2.5 可复用工作流 Skill · MaynorAI</title>
  <meta name="description" content="五套 ChatGPT Images 2.5 可抄工作流：Sketch 出片、Flare/Sunburst 选型、UGC 锁脸、局部编辑、像素精灵表。" />
  <link rel="canonical" href="https://xianyu110.github.io/awesome-gpt-image2.5/skills.html" />
  <meta name="theme-color" content="#070b14" />
  <link rel="stylesheet" href="./assets/site.css" />
  <style>
    .skills-grid { display:grid; gap:18px; grid-template-columns:1fr; margin: 28px 0 60px; }
    @media (min-width: 860px) { .skills-grid { grid-template-columns: 1fr 1fr; } }
    .skill-card {
      background: rgba(18,24,33,.72); border:1px solid rgba(110,231,255,.18);
      border-radius:18px; padding:22px 20px; display:flex; flex-direction:column; gap:10px;
    }
    .skill-card h2 { margin:0; font-size:1.2rem; }
    .skill-card .tagline { color:#9aa7b8; margin:0; }
    .skill-card ol { margin:0; padding-left:1.2rem; color:#e8eef7; }
    .skill-card li { margin:4px 0; }
    .skill-meta { font-size:13px; color:#9aa7b8; }
    .skill-meta a { color:#6ee7ff; }
    .skill-card details { margin-top:6px; }
    .skill-card pre {
      white-space:pre-wrap; background:rgba(0,0,0,.4); padding:12px; border-radius:10px;
      border:1px solid rgba(110,231,255,.12); font-size:12px; color:#d7e6ff;
    }
    .auto-sync {
      margin: 18px 0 0; padding:14px 16px; border-radius:14px;
      border:1px solid rgba(110,231,255,.2); background:rgba(110,231,255,.06); color:#c9d7ea; font-size:14px;
    }
  </style>
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <header class="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="./"><span class="brand-mark" aria-hidden="true">✦</span> GPT Image 2.5 Gallery</a>
      <nav class="nav-links" aria-label="主导航">
        <a href="./#gallery">案例</a>
        <a href="./skills.html" aria-current="page">工作流 Skill</a>
        <a href="https://github.com/xianyu110/awesome-gpt-image2.5#readme">README</a>
        <a href="https://xianyu110.github.io/gptimage2.5/">国内指南</a>
        <a href="https://github.com/xianyu110/awesome-gpt-image2.5">GitHub</a>
      </nav>
    </div>
  </header>
  <main class="wrap" style="padding-top:28px;padding-bottom:80px;">
    <div class="eyebrow"><span aria-hidden="true">✦</span> 可复用工作流</div>
    <h1 style="margin-top:8px;">五套 Images 2.5 Skill</h1>
    <p class="hero-sub" style="max-width:640px;">从社区案例抽象出来的可抄流程。按场景选一条跑；完整案例库仍在首页画廊。</p>
    <div class="auto-sync"><strong>自动入库：</strong>工作日 10:10 / 14:10 / 18:10 / 21:10 会把小时 digest 里的高信号玩法合并进仓库（有新才推）。小时聊天推送 ≠ 自动入库。</div>
    <div class="skills-grid" id="skills"></div>
  </main>
  <footer class="footer"><div class="wrap footer-inner"><div class="footer-brand"><strong>MaynorAI</strong> · Awesome GPT Image 2.5</div><div><a href="./">← 返回画廊</a></div></div></footer>
  <script>
  (async () => {
    const root = document.getElementById('skills');
    try {
      const res = await fetch('./data/skills.json', { cache: 'no-cache' });
      if (!res.ok) throw new Error(res.status);
      const skills = await res.json();
      root.innerHTML = skills.map(s => {
        const steps = (s.steps||[]).map(t => `<li>${escapeHtml(t)}</li>`).join('');
        const notes = (s.notes||[]).map(n => `<li>${escapeHtml(n)}</li>`).join('');
        let extra = '';
        if (s.briefing) extra += `<details><summary>Briefing 模板</summary><pre>${escapeHtml(s.briefing)}</pre></details>`;
        if (s.prompt_skeleton) extra += `<details><summary>Prompt 骨架</summary><pre>${escapeHtml(s.prompt_skeleton)}</pre></details>`;
        return `<article class="skill-card" id="${escapeAttr(s.id)}">
          <h2>${escapeHtml(s.name)}</h2>
          <p class="tagline">${escapeHtml(s.tagline)}</p>
          <p class="skill-meta"><strong>何时用：</strong>${escapeHtml(s.when)}</p>
          <ol>${steps}</ol>
          ${notes ? `<ul class="skill-meta">${notes}</ul>` : ''}
          ${extra}
          <p class="skill-meta">相关分类：<a href="./#gallery">${escapeHtml(s.related_category||'')}</a></p>
        </article>`;
      }).join('');
    } catch (e) {
      root.innerHTML = `<p>加载失败：${escapeHtml(String(e.message||e))}</p>`;
    }
    function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function escapeAttr(s){return escapeHtml(s);}
  })();
  </script>
</body>
</html>
